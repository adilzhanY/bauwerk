name: Check

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bauwerk
          POSTGRES_PASSWORD: bauwerk
          POSTGRES_DB: bauwerk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bauwerk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
        working-directory: server
      - run: npm run check
        working-directory: server
        env:
          DATABASE_URL: postgres://bauwerk:bauwerk@localhost:5432/bauwerk_test
